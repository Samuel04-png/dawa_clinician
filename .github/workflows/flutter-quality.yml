name: Flutter quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: python3 -m unittest discover -s tool -p 'test_coverage_report.py'
      - name: Fresh full suite and 80 percent line coverage gate
        run: bash tool/verify_coverage.sh
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: |
            coverage/lcov.info
            coverage/summary.json
            coverage/flutter-test.jsonl
          if-no-files-found: warn
